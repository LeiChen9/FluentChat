<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FluentChat</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <main class="stage">

    <!-- ── 聊天列表：persona 好友的会话，像 LINE 聊天页 ── -->
    <section class="view is-active" id="view-chats">
      <header class="page-head">
        <h1 class="page-title">Chats</h1>
      </header>
      <ul class="row-list" id="chat-list"></ul>
    </section>

    <!-- ── 联系人：persona 名册 ── -->
    <section class="view" id="view-contacts" hidden>
      <header class="page-head">
        <h1 class="page-title">Contacts</h1>
        <p class="page-sub">Your AI friends — tap one to talk</p>
      </header>
      <ul class="row-list" id="contact-list"></ul>
    </section>

    <!-- ── 朋友圈：好友们的动态信息流（本期静态占位） ── -->
    <section class="view" id="view-moments" hidden>
      <header class="page-head">
        <h1 class="page-title">Moments</h1>
        <p class="page-sub">See what your friends are up to</p>
      </header>
      <div class="moment-list" id="moment-list"></div>
    </section>

    <!-- ── 对话页：Unit 列表点一个就 push 进这里，像 WhatsApp 单个聊天 ── -->
    <section class="view view--chat" id="view-chat" hidden>
      <header class="chat-head">
        <button class="chat-back" id="chat-back" type="button" aria-label="Back to chats">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 4.5 7.5 12 15 19.5" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <span class="avatar chat-av" id="chat-av"><img src="assets/npc-cat.webp" alt=""></span>

        <span class="chat-id">
          <b id="chat-name">Unit</b>
          <i id="chat-state">Connecting…</i>
        </span>

        <!-- 清空本次对话：本地历史 + 拆线重连（模型记忆一起清） -->
        <button class="chat-reset" id="chat-reset" type="button" aria-label="Clear this chat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 7h15M9.7 7V5.4c0-.66.54-1.2 1.2-1.2h2.2c.66 0 1.2.54 1.2 1.2V7m2.9 0-.66 11.05c-.05.84-.75 1.5-1.6 1.5H9.26c-.85 0-1.55-.66-1.6-1.5L7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <div class="chat-body" id="chat-body">
        <p class="chat-day">Today</p>
        <!-- 气泡 / 复盘卡片由 live.js 注入 -->
      </div>

      <!-- 底下这一条：左边打电话，右边文字输入 -->
      <form class="chat-bar" id="chat-bar" autocomplete="off">
        <button class="chat-call" id="chat-call" type="button" aria-label="Start a call" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.8 3.6c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.2 1.2c.9 1.7 2.3 3.1 4 4l1.2-1.2c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.3 1.3c-.8.8-2 1.1-3.1.7C9.5 16.6 6.2 13.3 4 8.6c-.4-1.1-.1-2.3.7-3.1l2.1-1.9Z" fill="currentColor"/>
          </svg>
        </button>
        <input class="chat-input" id="chat-input" type="text" placeholder="Connecting…"
               enterkeyhint="send" autocomplete="off" aria-label="Message" disabled>
        <button class="chat-send" id="chat-send" type="submit" disabled>Send</button>
      </form>

      <!-- 通话中：盖住整个对话页 -->
      <div class="call" id="call" hidden>
        <span class="avatar call-av" id="call-av"><img src="assets/npc-cat.webp" alt=""></span>
        <p class="call__name" id="call-name">Unit</p>
        <p class="call__state" id="call-state">Connecting…</p>
        <p class="call__said" id="call-said"></p>
        <button class="call__end" id="call-end" type="button" aria-label="End call">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.8 3.6c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.2 1.2c.9 1.7 2.3 3.1 4 4l1.2-1.2c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.3 1.3c-.8.8-2 1.1-3.1.7C9.5 16.6 6.2 13.3 4 8.6c-.4-1.1-.1-2.3.7-3.1l2.1-1.9Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ── Me（接下来做） ── -->
    <section class="view view--center" id="view-me" hidden>
      <div class="placeholder">
        <p class="placeholder__title">Progress</p>
        <p class="placeholder__note">Coming next</p>
      </div>
    </section>

  </main>

  <!-- ── 底部栏：聊天 / 联系人 / 朋友圈 / Me ── -->
  <nav class="tabbar" role="tablist" aria-label="Main tabs">
    <button class="tab" role="tab" data-view="chats" aria-selected="true" aria-controls="view-chats">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M9 4.5h10a6 6 0 0 1 6 6v3.5a6 6 0 0 1-6 6h-3.6l-5.4 3.2V20H9a6 6 0 0 1-6-6v-3.5a6 6 0 0 1 6-6Z" fill="currentColor"/>
      </svg>
      <span>Chats</span>
    </button>

    <button class="tab" role="tab" data-view="contacts" aria-controls="view-contacts">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="10" r="4.6" stroke="currentColor" stroke-width="2"/>
        <path d="M5.5 23.5c.8-4 4.3-6.3 8.5-6.3s7.7 2.3 8.5 6.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Contacts</span>
    </button>

    <button class="tab" role="tab" data-view="moments" aria-controls="view-moments">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="5" y="7" width="18" height="14" rx="3" fill="currentColor"/>
        <circle cx="14" cy="14" r="3.4" fill="#faf6ee"/>
        <rect x="17.6" y="9.4" width="2.2" height="2.2" rx=".6" fill="#faf6ee"/>
      </svg>
      <span>Moments</span>
    </button>

    <button class="tab" role="tab" data-view="me" aria-controls="view-me">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="9.8" r="4.8" fill="currentColor"/>
        <path d="M14 16.6c-4.7 0-8.5 3.2-8.5 7.1v.8h17v-.8c0-3.9-3.8-7.1-8.5-7.1Z" fill="currentColor"/>
      </svg>
      <span>Me</span>
    </button>
  </nav>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
