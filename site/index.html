<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FluentChat</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <!-- 左上角品牌：点回首页（NPC 页） -->
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="回到首页">FluentChat</button>
  </header>

  <main class="stage">

    <!-- ── 首页（NPC 页）：左上角 FluentChat 回这里 ── -->
    <section class="view view--center is-active" id="view-home">
      <div class="hero">
        <div class="npc-wrap">
          <img class="npc" src="assets/npc-cat.webp" width="510" height="527"
               alt="你的英语陪练伙伴，一只猫">
        </div>
        <p class="greeting" id="greeting"></p>
      </div>
    </section>

    <!-- ── Unit：场景列表 ── -->
    <section class="view" id="view-unit" hidden>
      <header class="page-head">
        <h1 class="page-title">Unit</h1>
        <p class="page-sub">选一个对话，直接开口聊</p>
      </header>

      <ul class="unit-list" id="unit-list"></ul>
    </section>

    <!-- ── 对话页：Unit 列表点一个就 push 进这里，像 WhatsApp 单个聊天 ── -->
    <section class="view view--chat" id="view-chat" hidden>
      <header class="chat-head">
        <button class="chat-back" id="chat-back" type="button" aria-label="返回对话列表">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 4.5 7.5 12 15 19.5" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <span class="avatar chat-av" id="chat-av"><img src="assets/npc-cat.webp" alt=""></span>

        <span class="chat-id">
          <b id="chat-name">Unit</b>
          <i id="chat-state">连接中…</i>
        </span>
      </header>

      <div class="chat-body" id="chat-body">
        <p class="chat-day">今天</p>
        <!-- 气泡 / 复盘卡片由 live.js 注入 -->
      </div>

      <!-- 底下这一条：左边打电话，右边文字输入 -->
      <form class="chat-bar" id="chat-bar" autocomplete="off">
        <button class="chat-call" id="chat-call" type="button" aria-label="开始语音通话" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.8 3.6c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.2 1.2c.9 1.7 2.3 3.1 4 4l1.2-1.2c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.3 1.3c-.8.8-2 1.1-3.1.7C9.5 16.6 6.2 13.3 4 8.6c-.4-1.1-.1-2.3.7-3.1l2.1-1.9Z" fill="currentColor"/>
          </svg>
        </button>
        <input class="chat-input" id="chat-input" type="text" placeholder="连接中…"
               enterkeyhint="send" autocomplete="off" aria-label="输入消息" disabled>
        <button class="chat-send" id="chat-send" type="submit" disabled>发送</button>
      </form>

      <!-- 通话中：盖住整个对话页 -->
      <div class="call" id="call" hidden>
        <span class="avatar call-av" id="call-av"><img src="assets/npc-cat.webp" alt=""></span>
        <p class="call__name" id="call-name">Unit</p>
        <p class="call__state" id="call-state">正在接通…</p>
        <p class="call__said" id="call-said"></p>
        <button class="call__end" id="call-end" type="button" aria-label="挂断">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.8 3.6c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.2 1.2c.9 1.7 2.3 3.1 4 4l1.2-1.2c.6-.6 1.6-.6 2.2 0l2 2c.6.6.6 1.6 0 2.2l-1.3 1.3c-.8.8-2 1.1-3.1.7C9.5 16.6 6.2 13.3 4 8.6c-.4-1.1-.1-2.3.7-3.1l2.1-1.9Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ── Me（接下来做） ── -->
    <section class="view view--center" id="view-me" hidden>
      <div class="placeholder">
        <p class="placeholder__title">学习进度</p>
        <p class="placeholder__note">接下来做</p>
      </div>
    </section>

  </main>

  <!-- ── 底部栏 ── -->
  <nav class="tabbar" role="tablist" aria-label="主导航">
    <!-- Free Chat 还没设计，先置灰占位；首页走左上角 FluentChat 回 NPC 页 -->
    <button class="tab" role="tab" aria-selected="false" disabled>
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M9 4.5h10a6 6 0 0 1 6 6v3.5a6 6 0 0 1-6 6h-3.6l-5.4 3.2V20H9a6 6 0 0 1-6-6v-3.5a6 6 0 0 1 6-6Z" fill="currentColor"/>
      </svg>
      <span>Free Chat</span>
    </button>

    <button class="tab" role="tab" data-view="unit" aria-selected="false" aria-controls="view-unit">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M7.5 20.5h13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" opacity=".38"/>
        <circle cx="7.5" cy="20.5" r="3" fill="currentColor"/>
        <circle cx="14" cy="14.5" r="2.6" fill="currentColor" opacity=".62"/>
        <circle cx="20.5" cy="8.5" r="2.2" fill="currentColor" opacity=".32"/>
      </svg>
      <span>Unit</span>
    </button>

    <button class="tab" role="tab" data-view="me" aria-selected="false" aria-controls="view-me">
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="9.8" r="4.8" fill="currentColor"/>
        <path d="M14 16.6c-4.7 0-8.5 3.2-8.5 7.1v.8h17v-.8c0-3.9-3.8-7.1-8.5-7.1Z" fill="currentColor"/>
      </svg>
      <span>Me</span>
    </button>
  </nav>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
